<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Westla – connexion Tesla</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 24px; }
    .card { max-width: 520px; margin: 40px auto; background: #1c1c1e; border-radius: 16px; padding: 24px; }
    h1 { font-size: 1.3rem; margin-top: 0; }
    code, textarea { font-family: ui-monospace, monospace; }
    textarea { width: 100%; height: 90px; background: #000; color: #9f9; border: 1px solid #444; border-radius: 8px; padding: 8px; }
    a.btn, button { display: inline-block; margin-top: 12px; padding: 12px 18px; background: #e82127; color: #fff; border: 0; border-radius: 10px; text-decoration: none; font-size: 1rem; }
    p.small { color: #aaa; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Connexion Tesla réussie</h1>
    <p>Retour vers l'application Westla…</p>
    <p><a id="open" class="btn" href="#">Ouvrir Westla</a></p>
    <p class="small">Si rien ne se passe, copiez le code ci-dessous et collez-le dans Westla (étape 4, champ « URL de redirection ou code »).</p>
    <textarea id="code" readonly></textarea>
    <p><button id="copy">Copier le code</button></p>
  </div>
  <script>
    // Tesla redirects here with ?code=...&state=... ; hand the parameters over to the Android app.
    var target = "westla://callback" + window.location.search;
    document.getElementById("open").href = target;
    var params = new URLSearchParams(window.location.search);
    document.getElementById("code").value = params.get("code") || "(aucun code dans l'adresse)";
    document.getElementById("copy").onclick = function () {
      navigator.clipboard && navigator.clipboard.writeText(document.getElementById("code").value);
    };
    if (params.get("code")) {
      setTimeout(function () { window.location.replace(target); }, 300);
    }
  </script>
</body>
</html>
